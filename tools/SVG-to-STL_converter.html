<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG to STL converter</title>
<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #1a1a1e;
  --surface: #24242a;
  --surface2: #2e2e36;
  --border: #3a3a44;
  --text: #e8e8ec;
  --text-dim: #8888a0;
  --accent: #4a9eff;
  --accent-glow: #4a9eff33;
  --success: #44cc88;
  --danger: #ff5566;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}

.app {
  max-width: 960px;
  margin: 0 auto;
  padding: 40px 24px;
}

h1 {
  font-size: 22px;
  font-weight: 600;
  margin: 0 0 6px 0;
  letter-spacing: -0.3px;
}

.subtitle {
  color: var(--text-dim);
  font-size: 13px;
  margin: 0 0 32px 0;
}

.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 48px 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  margin-bottom: 24px;
  position: relative;
}

.drop-zone:hover,
.drop-zone.dragover {
  border-color: var(--accent);
  background: var(--accent-glow);
}

.drop-zone input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.drop-icon {
  font-size: 36px;
  margin-bottom: 12px;
  opacity: 0.5;
}

.drop-label {
  font-size: 14px;
  color: var(--text-dim);
}

.drop-label strong {
  color: var(--accent);
}

.info-bar {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  background: var(--surface);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 24px;
  font-size: 13px;
  align-items: center;
}

.info-bar .filename {
  font-weight: 600;
  color: var(--accent);
}

.info-bar .stat {
  color: var(--text-dim);
}

.info-bar .stat b {
  color: var(--text);
  font-weight: 500;
}

.dims-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: end;
  margin-bottom: 24px;
}

.dim-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.dim-group label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-dim);
  font-weight: 600;
}

.dim-group input {
  width: 100px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  font-family: Helvetica, Arial, sans-serif;
  font-size: 16px;
  outline: none;
  transition: border-color 0.15s;
}

.dim-group input:focus {
  border-color: var(--accent);
}

.lock-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 6px;
  padding: 8px 12px;
  cursor: pointer;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 13px;
  transition: border-color 0.15s, color 0.15s;
  align-self: flex-end;
  margin-bottom: 1px;
}

.lock-btn:hover {
  border-color: var(--accent);
  color: var(--text);
}

.lock-btn.active {
  border-color: var(--accent);
  color: var(--accent);
}

.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}

@media (max-width: 640px) {
  .panels {
    grid-template-columns: 1fr;
  }
}

.panel {
  background: var(--surface);
  border-radius: 10px;
  overflow: hidden;
}

.panel-header {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-dim);
  padding: 12px 16px 8px;
  font-weight: 600;
}

.preview-area {
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--surface2);
}

.preview-area svg {
  max-width: 100%;
  max-height: 100%;
}

.preview-area canvas {
  max-width: 100%;
  max-height: 100%;
}

.actions {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}

.btn:active {
  transform: scale(0.97);
}

.btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}

.btn-primary:hover:not(:disabled) {
  opacity: 0.88;
}

.btn-success {
  background: var(--success);
  color: #111;
}

.btn-success:hover:not(:disabled) {
  opacity: 0.88;
}

.status {
  font-size: 13px;
  color: var(--text-dim);
}

.status.error {
  color: var(--danger);
}

.status.ok {
  color: var(--success);
}

.hidden {
  display: none;
}
</style>
</head>
<body>
<div class="app">
  <h1>SVG → STL converter</h1>
  <p class="subtitle">Extrudes SVG shapes with subpath cutouts. Upload a single-object SVG.</p>

  <div class="drop-zone" id="dropZone">
    <input type="file" accept=".svg" id="fileInput">
    <div class="drop-icon">⬡</div>
    <div class="drop-label">Drop an SVG file here or <strong>browse</strong></div>
  </div>

  <div id="infoBar" class="info-bar hidden"></div>

  <div id="dimsSection" class="dims-row hidden">
    <div class="dim-group">
      <label>Width (X) mm</label>
      <input type="number" id="dimX" value="100" min="0.1" step="0.1">
    </div>
    <div class="dim-group">
      <label>Height (Y) mm</label>
      <input type="number" id="dimY" value="100" min="0.1" step="0.1">
    </div>
    <div class="dim-group">
      <label>Depth (Z) mm</label>
      <input type="number" id="dimZ" value="10" min="0.1" step="0.1">
    </div>
    <button class="lock-btn active" id="lockAspect" title="Lock aspect ratio">&#x1f512; Lock aspect</button>
  </div>

  <div id="panels" class="panels hidden">
    <div class="panel">
      <div class="panel-header">SVG input</div>
      <div class="preview-area" id="svgPreview"></div>
    </div>
    <div class="panel">
      <div class="panel-header">STL preview</div>
      <div class="preview-area" id="stlPreview">
        <canvas id="gl" width="400" height="400"></canvas>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="convertBtn" disabled>Convert to STL</button>
    <button class="btn btn-success hidden" id="downloadBtn">Download STL</button>
    <span class="status" id="status"></span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
// ── earcut (mapbox/earcut, ISC License) ──
function earcut(data,holeIndices,dim){dim=dim||2;var hasHoles=holeIndices&&holeIndices.length,outerLen=hasHoles?holeIndices[0]*dim:data.length,outerNode=linkedList(data,0,outerLen,dim,true),triangles=[];if(!outerNode||outerNode.next===outerNode.prev)return triangles;var minX,minY,maxX,maxY,x,y,invSize;if(hasHoles)outerNode=eliminateHoles(data,holeIndices,outerNode,dim);if(data.length>80*dim){minX=maxX=data[0];minY=maxY=data[1];for(var i=dim;i<outerLen;i+=dim){x=data[i];y=data[i+1];if(x<minX)minX=x;if(y<minY)minY=y;if(x>maxX)maxX=x;if(y>maxY)maxY=y;}invSize=Math.max(maxX-minX,maxY-minY);invSize=invSize!==0?32767/invSize:0;}earcutLinked(outerNode,triangles,dim,minX,minY,invSize,0);return triangles;}
function linkedList(data,start,end,dim,clockwise){var i,last;if(clockwise===(signedArea(data,start,end,dim)>0)){for(i=start;i<end;i+=dim)last=insertNode(i,data[i],data[i+1],last);}else{for(i=end-dim;i>=start;i-=dim)last=insertNode(i,data[i],data[i+1],last);}if(last&&equals(last,last.next)){removeNode(last);last=last.next;}if(!last)return last;last.next.prev=last;last.prev.next=last;return last.next;}
function filterPoints(start,end){if(!start)return start;if(!end)end=start;var p=start,again;do{again=false;if(!p.steiner&&(equals(p,p.next)||area(p.prev,p,p.next)===0)){removeNode(p);p=end=p.prev;if(p===p.next)break;again=true;}else{p=p.next;}}while(again||p!==end);return end;}
function earcutLinked(ear,triangles,dim,minX,minY,invSize,pass){if(!ear)return;if(!pass&&invSize)indexCurve(ear,minX,minY,invSize);var stop=ear,prev,next;while(ear.prev!==ear.next){prev=ear.prev;next=ear.next;if(invSize?isEarHashed(ear,minX,minY,invSize):isEar(ear)){triangles.push(prev.i/dim|0);triangles.push(ear.i/dim|0);triangles.push(next.i/dim|0);removeNode(ear);ear=next.next;stop=next.next;continue;}ear=next;if(ear===stop){if(!pass){earcutLinked(filterPoints(ear),triangles,dim,minX,minY,invSize,1);}else if(pass===1){ear=cureLocalIntersections(filterPoints(ear),triangles,dim);earcutLinked(ear,triangles,dim,minX,minY,invSize,2);}else if(pass===2){splitEarcut(ear,triangles,dim,minX,minY,invSize);}break;}}}
function isEar(ear){var a=ear.prev,b=ear,c=ear.next;if(area(a,b,c)>=0)return false;var ax=a.x,bx=b.x,cx=c.x,ay=a.y,by=b.y,cy=c.y;var x0=ax<bx?(ax<cx?ax:cx):(bx<cx?bx:cx),y0=ay<by?(ay<cy?ay:cy):(by<cy?by:cy),x1=ax>bx?(ax>cx?ax:cx):(bx>cx?bx:cx),y1=ay>by?(ay>cy?ay:cy):(by>cy?by:cy);var p=c.next;while(p!==a){if(p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1&&pointInTriangle(ax,ay,bx,by,cx,cy,p.x,p.y)&&area(p.prev,p,p.next)>=0)return false;p=p.next;}return true;}
function isEarHashed(ear,minX,minY,invSize){var a=ear.prev,b=ear,c=ear.next;if(area(a,b,c)>=0)return false;var ax=a.x,bx=b.x,cx=c.x,ay=a.y,by=b.y,cy=c.y;var x0=ax<bx?(ax<cx?ax:cx):(bx<cx?bx:cx),y0=ay<by?(ay<cy?ay:cy):(by<cy?by:cy),x1=ax>bx?(ax>cx?ax:cx):(bx>cx?bx:cx),y1=ay>by?(ay>cy?ay:cy):(by>cy?by:cy);var minZ=zOrder(x0,y0,minX,minY,invSize),maxZ=zOrder(x1,y1,minX,minY,invSize);var p=ear.prevZ,n=ear.nextZ;while(p&&p.z>=minZ&&n&&n.z<=maxZ){if(p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1&&p!==a&&p!==c&&pointInTriangle(ax,ay,bx,by,cx,cy,p.x,p.y)&&area(p.prev,p,p.next)>=0)return false;p=p.prevZ;if(n.x>=x0&&n.x<=x1&&n.y>=y0&&n.y<=y1&&n!==a&&n!==c&&pointInTriangle(ax,ay,bx,by,cx,cy,n.x,n.y)&&area(n.prev,n,n.next)>=0)return false;n=n.nextZ;}while(p&&p.z>=minZ){if(p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1&&p!==a&&p!==c&&pointInTriangle(ax,ay,bx,by,cx,cy,p.x,p.y)&&area(p.prev,p,p.next)>=0)return false;p=p.prevZ;}while(n&&n.z<=maxZ){if(n.x>=x0&&n.x<=x1&&n.y>=y0&&n.y<=y1&&n!==a&&n!==c&&pointInTriangle(ax,ay,bx,by,cx,cy,n.x,n.y)&&area(n.prev,n,n.next)>=0)return false;n=n.nextZ;}return true;}
function cureLocalIntersections(start,triangles,dim){var p=start;do{var a=p.prev,b=p.next.next;if(!equals(a,b)&&intersects(a,p,p.next,b)&&locallyInside(a,b)&&locallyInside(b,a)){triangles.push(a.i/dim|0);triangles.push(p.i/dim|0);triangles.push(b.i/dim|0);removeNode(p);removeNode(p.next);p=start=b;}p=p.next;}while(p!==start);return filterPoints(p);}
function splitEarcut(start,triangles,dim,minX,minY,invSize){var a=start;do{var b=a.next.next;while(b!==a.prev){if(a.i!==b.i&&isValidDiagonal(a,b)){var c=splitPolygon(a,b);a=filterPoints(a,a.next);c=filterPoints(c,c.next);earcutLinked(a,triangles,dim,minX,minY,invSize,0);earcutLinked(c,triangles,dim,minX,minY,invSize,0);return;}b=b.next;}a=a.next;}while(a!==start);}
function eliminateHoles(data,holeIndices,outerNode,dim){var queue=[],i,len,start,end,list;for(i=0,len=holeIndices.length;i<len;i++){start=holeIndices[i]*dim;end=i<len-1?holeIndices[i+1]*dim:data.length;list=linkedList(data,start,end,dim,false);if(list===list.next)list.steiner=true;queue.push(getLeftmost(list));}queue.sort(compareX);for(i=0;i<queue.length;i++){outerNode=eliminateHole(queue[i],outerNode);}return outerNode;}
function compareX(a,b){return a.x-b.x;}
function eliminateHole(hole,outerNode){var bridge=findHoleBridge(hole,outerNode);if(!bridge)return outerNode;var bridgeReverse=splitPolygon(bridge,hole);filterPoints(bridgeReverse,bridgeReverse.next);return filterPoints(bridge,bridge.next);}
function findHoleBridge(hole,outerNode){var p=outerNode,hx=hole.x,hy=hole.y,qx=-Infinity,m;do{if(hy<=p.y&&hy>=p.next.y&&p.next.y!==p.y){var x=p.x+(hy-p.y)*(p.next.x-p.x)/(p.next.y-p.y);if(x<=hx&&x>qx){qx=x;m=p.x<p.next.x?p:p.next;if(x===hx)return m;}}p=p.next;}while(p!==outerNode);if(!m)return null;var stop=m,mx=m.x,my=m.y,tanMin=Infinity,tan;p=m;do{if(hx>=p.x&&p.x>=mx&&hx!==p.x&&pointInTriangle(hy<my?hx:qx,hy,mx,my,hy<my?qx:hx,hy,p.x,p.y)){tan=Math.abs(hy-p.y)/(hx-p.x);if(locallyInside(p,hole)&&(tan<tanMin||(tan===tanMin&&(p.x>m.x||(p.x===m.x&&sectorContainsSector(m,p)))))){{m=p;tanMin=tan;}}}p=p.next;}while(p!==stop);return m;}
function sectorContainsSector(m,p){return area(m.prev,m,p.prev)<0&&area(p.next,m,m.next)<0;}
function indexCurve(start,minX,minY,invSize){var p=start;do{if(p.z===0)p.z=zOrder(p.x,p.y,minX,minY,invSize);p.prevZ=p.prev;p.nextZ=p.next;p=p.next;}while(p!==start);p.prevZ.nextZ=null;p.prevZ=null;sortLinked(p);}
function sortLinked(list){var i,p,q,e,tail,numMerges,pSize,qSize,inSize=1;do{p=list;list=null;tail=null;numMerges=0;while(p){numMerges++;q=p;pSize=0;for(i=0;i<inSize;i++){pSize++;q=q.nextZ;if(!q)break;}qSize=inSize;while(pSize>0||(qSize>0&&q)){if(pSize!==0&&(qSize===0||!q||p.z<=q.z)){e=p;p=p.nextZ;pSize--;}else{e=q;q=q.nextZ;qSize--;}if(tail)tail.nextZ=e;else list=e;e.prevZ=tail;tail=e;}p=q;}tail.nextZ=null;inSize*=2;}while(numMerges>1);return list;}
function zOrder(x,y,minX,minY,invSize){x=(x-minX)*invSize|0;y=(y-minY)*invSize|0;x=(x|(x<<8))&0x00FF00FF;x=(x|(x<<4))&0x0F0F0F0F;x=(x|(x<<2))&0x33333333;x=(x|(x<<1))&0x55555555;y=(y|(y<<8))&0x00FF00FF;y=(y|(y<<4))&0x0F0F0F0F;y=(y|(y<<2))&0x33333333;y=(y|(y<<1))&0x55555555;return x|(y<<1);}

function intersects(p1,q1,p2,q2){var o1=sign(area(p1,q1,p2)),o2=sign(area(p1,q1,q2)),o3=sign(area(p2,q2,p1)),o4=sign(area(p2,q2,q1));if(o1!==o2&&o3!==o4)return true;if(o1===0&&onSegment(p1,p2,q1))return true;if(o2===0&&onSegment(p1,q2,q1))return true;if(o3===0&&onSegment(p2,p1,q2))return true;if(o4===0&&onSegment(p2,q1,q2))return true;return false;}
function onSegment(p,q,r){return q.x<=Math.max(p.x,r.x)&&q.x>=Math.min(p.x,r.x)&&q.y<=Math.max(p.y,r.y)&&q.y>=Math.min(p.y,r.y);}

function insertNode(i,x,y,last){var p=new Node(i,x,y);if(!last){p.prev=p;p.next=p;}else{p.next=last.next;p.prev=last;last.next.prev=p;last.next=p;}return p;}

function signedArea(data,start,end,dim){var sum=0;for(var i=start,j=end-dim;i<end;i+=dim){sum+=(data[j]-data[i])*(data[i+1]+data[j+1]);j=i;}return sum;}

// ── App ──

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const infoBar = document.getElementById('infoBar');
const dimsSection = document.getElementById('dimsSection');
const panels = document.getElementById('panels');
const svgPreview = document.getElementById('svgPreview');
const convertBtn = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const statusEl = document.getElementById('status');
const glCanvas = document.getElementById('gl');
const dimX = document.getElementById('dimX');
const dimY = document.getElementById('dimY');
const dimZ = document.getElementById('dimZ');
const lockAspect = document.getElementById('lockAspect');

let svgText = null, stlBlob = null, svgAspect = 1, aspectLocked = true;

lockAspect.addEventListener('click', () => {
  aspectLocked = !aspectLocked;
  lockAspect.classList.toggle('active', aspectLocked);
  lockAspect.innerHTML = aspectLocked ? '&#x1f512; Lock aspect' : '&#x1f513; Unlock';
});
dimX.addEventListener('input', () => { if (aspectLocked && svgAspect) dimY.value = (parseFloat(dimX.value) / svgAspect).toFixed(1); });
dimY.addEventListener('input', () => { if (aspectLocked && svgAspect) dimX.value = (parseFloat(dimY.value) * svgAspect).toFixed(1); });

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

function handleFile(file) {
  if (!file.name.toLowerCase().endsWith('.svg')) { setStatus('Please upload an SVG file.', true); return; }
  const reader = new FileReader();
  reader.onload = () => { svgText = reader.result; showSvgPreview(svgText, file.name); convertBtn.disabled = false; downloadBtn.classList.add('hidden'); stlBlob = null; setStatus(''); };
  reader.readAsText(file);
}

function showSvgPreview(text, name) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'image/svg+xml');
  const svg = doc.querySelector('svg');
  if (!svg) { setStatus('Invalid SVG file.', true); return; }
  const clone = svg.cloneNode(true);
  clone.setAttribute('width', '100%'); clone.setAttribute('height', '100%');
  svgPreview.innerHTML = '';
  svgPreview.appendChild(clone);

  const vb = svg.getAttribute('viewBox');
  let svgW, svgH;
  if (vb) { const p = vb.split(/[\s,]+/).map(Number); svgW = p[2]; svgH = p[3]; }
  else { svgW = parseFloat(svg.getAttribute('width')) || 100; svgH = parseFloat(svg.getAttribute('height')) || 100; }
  svgAspect = svgW / svgH;
  if (svgW >= svgH) { dimX.value = '100'; dimY.value = (100 / svgAspect).toFixed(1); }
  else { dimY.value = '100'; dimX.value = (100 * svgAspect).toFixed(1); }

  const paths = svg.querySelectorAll('path, rect, circle, ellipse, polygon, polyline');
  infoBar.innerHTML = `<span class="filename">${name}</span><span class="stat">Elements: <b>${paths.length}</b></span><span class="stat">SVG: <b>${Math.round(svgW)}×${Math.round(svgH)}</b></span>`;
  infoBar.classList.remove('hidden');
  dimsSection.classList.remove('hidden');
  panels.classList.remove('hidden');
}

convertBtn.addEventListener('click', () => {
  setStatus('Converting…');
  requestAnimationFrame(() => {
    try {
      const result = convertSvgToStl(svgText, parseFloat(dimX.value)||100, parseFloat(dimY.value)||100, parseFloat(dimZ.value)||10);
      stlBlob = result.blob;
      setStatus(`Done — ${result.triangleCount.toLocaleString()} triangles`, false, true);
      downloadBtn.classList.remove('hidden');
      renderStlPreview(result.positions, result.normals);
    } catch (err) { console.error(err); setStatus('Error: ' + err.message, true); }
  });
});

downloadBtn.addEventListener('click', () => {
  if (!stlBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(stlBlob); a.download = 'output.stl'; a.click(); URL.revokeObjectURL(a.href);
});

function setStatus(msg, isError = false, isOk = false) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (isError ? ' error' : '') + (isOk ? ' ok' : '');
}

// ── Conversion ──
// Orientation: SVG X → 3D X (width), SVG Y (flipped) → 3D Z (height/up), depth → Y
// STL convention: Z is up. Model centered at origin, front face at -Y/2, back at +Y/2

function convertSvgToStl(text, targetW, targetH, targetD) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'image/svg+xml');
  const svg = doc.querySelector('svg');
  if (!svg) throw new Error('No <svg> element found');

  const pathEls = svg.querySelectorAll('path, rect, circle, ellipse, polygon, polyline');
  if (!pathEls.length) throw new Error('No shape elements found');

  let allSubpaths = [];
  for (const el of pathEls) {
    const d = getPathData(el);
    if (!d) continue;
    allSubpaths.push(...parsePathToSubpaths(d));
  }
  if (!allSubpaths.length) throw new Error('Could not parse any paths');

  const vb = svg.getAttribute('viewBox');
  let svgW, svgH, svgOx = 0, svgOy = 0;
  if (vb) { const p = vb.split(/[\s,]+/).map(Number); svgOx = p[0]; svgOy = p[1]; svgW = p[2]; svgH = p[3]; }
  else { svgW = parseFloat(svg.getAttribute('width')) || 100; svgH = parseFloat(svg.getAttribute('height')) || 100; }

  const scaleX = targetW / svgW, scaleY = targetH / svgH;

  // Transform: center, scale, flip Y for upright viewing
  const transformed = allSubpaths.map(sub =>
    sub.map(p => [
      (p[0] - svgOx) * scaleX - targetW / 2,
      (svgH - (p[1] - svgOy)) * scaleY - targetH / 2
    ])
  );

  // Clean degenerate points
  const cleaned = transformed.map(sub => {
    const out = [sub[0]];
    for (let i = 1; i < sub.length; i++) {
      const p = sub[i], q = out[out.length - 1];
      if (Math.abs(p[0] - q[0]) > 0.001 || Math.abs(p[1] - q[1]) > 0.001) out.push(p);
    }
    if (out.length > 1) {
      const f = out[0], l = out[out.length - 1];
      if (Math.abs(f[0] - l[0]) < 0.01 && Math.abs(f[1] - l[1]) < 0.01) out.pop();
    }
    return out;
  }).filter(s => s.length >= 3);

  console.log(`Parsed ${cleaned.length} subpaths from SVG`);

  // Even-odd classification
  const groups = classifyEvenOdd(cleaned);
  console.log(`Classified into ${groups.length} solid groups`);

  const allTriangles = [];
  const halfD = targetD / 2;

  for (const group of groups) {
    const outer = group.outer;
    const holes = group.holes;

    if (polyArea(outer) < 0) outer.reverse();
    for (const h of holes) { if (polyArea(h) > 0) h.reverse(); }

    // Build earcut input
    const coords = [];
    const holeIndices = [];
    for (const p of outer) coords.push(p[0], p[1]);
    for (const h of holes) {
      holeIndices.push(coords.length / 2);
      for (const p of h) coords.push(p[0], p[1]);
    }

    const indices = earcut(coords, holeIndices.length ? holeIndices : null, 2);

    // Coordinate mapping: 2D coords[i*2] = X, coords[i*2+1] = height → Z (up)
    // Depth axis = Y. Front face at -halfD (facing viewer at -Y), back at +halfD.

    // Front face (-Y, normal facing -Y)
    for (let i = 0; i < indices.length; i += 3) {
      const a = indices[i], b = indices[i+1], c = indices[i+2];
      allTriangles.push({ n: [0,-1,0], v: [
        [coords[a*2], -halfD, coords[a*2+1]],
        [coords[b*2], -halfD, coords[b*2+1]],
        [coords[c*2], -halfD, coords[c*2+1]]
      ]});
    }
    // Back face (+Y, normal facing +Y, reversed winding)
    for (let i = 0; i < indices.length; i += 3) {
      const a = indices[i], b = indices[i+1], c = indices[i+2];
      allTriangles.push({ n: [0,1,0], v: [
        [coords[a*2], halfD, coords[a*2+1]],
        [coords[c*2], halfD, coords[c*2+1]],
        [coords[b*2], halfD, coords[b*2+1]]
      ]});
    }

    addWalls(allTriangles, outer, halfD, false);
    for (const h of holes) addWalls(allTriangles, h, halfD, true);
  }

  return buildStlBinary(allTriangles);
}

function addWalls(tris, contour, halfD, flip) {
  const n = contour.length;
  for (let i = 0; i < n; i++) {
    const a = contour[i], b = contour[(i+1) % n];
    const dx = b[0]-a[0], dz = b[1]-a[1], len = Math.sqrt(dx*dx+dz*dz);
    if (len < 1e-10) continue;
    // Normal in XZ plane (perpendicular to edge)
    let nx = dz/len, nz = -dx/len;
    if (flip) { nx = -nx; nz = -nz; }
    // Vertices: [x, y(depth), z(height)]
    const bl=[a[0],-halfD,a[1]], br=[b[0],-halfD,b[1]], tl=[a[0],halfD,a[1]], tr=[b[0],halfD,b[1]];
    if (!flip) {
      tris.push({ n:[nx,0,nz], v:[bl,br,tr] });
      tris.push({ n:[nx,0,nz], v:[bl,tr,tl] });
    } else {
      tris.push({ n:[nx,0,nz], v:[bl,tr,br] });
      tris.push({ n:[nx,0,nz], v:[bl,tl,tr] });
    }
  }
}

function polyArea(pts) {
  let a = 0;
  for (let i = 0, n = pts.length; i < n; i++) { const j = (i+1)%n; a += pts[i][0]*pts[j][1] - pts[j][0]*pts[i][1]; }
  return a / 2;
}

function ptInPoly(pt, poly) {
  let inside = false;
  for (let i = 0, j = poly.length-1; i < poly.length; j = i++) {
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if ((yi>pt[1]) !== (yj>pt[1]) && pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi) inside = !inside;
  }
  return inside;
}

function sampleInterior(pts) {
  // Try centroid of first 3 points; if not inside, try edge midpoints
  const cx = (pts[0][0]+pts[1][0]+pts[2][0])/3;
  const cy = (pts[0][1]+pts[1][1]+pts[2][1])/3;
  if (ptInPoly([cx,cy], pts)) return [cx, cy];
  // Fallback: midpoint of first edge, nudged inward
  const mx = (pts[0][0]+pts[1][0])/2, my = (pts[0][1]+pts[1][1])/2;
  return [mx, my];
}

function classifyEvenOdd(subpaths) {
  const infos = subpaths.map((pts, idx) => {
    const sample = sampleInterior(pts);
    let depth = 0;
    for (let j = 0; j < subpaths.length; j++) {
      if (j === idx) continue;
      if (ptInPoly(sample, subpaths[j])) depth++;
    }
    return { pts, idx, depth, absArea: Math.abs(polyArea(pts)) };
  });

  const outers = infos.filter(i => i.depth % 2 === 0);
  const holes = infos.filter(i => i.depth % 2 === 1);

  const groups = outers.map(o => ({ outer: o.pts, holes: [], absArea: o.absArea }));

  for (const h of holes) {
    const sample = sampleInterior(h.pts);
    let bestGroup = null, bestArea = Infinity;
    for (const g of groups) {
      if (ptInPoly(sample, g.outer) && g.absArea < bestArea) { bestGroup = g; bestArea = g.absArea; }
    }
    if (bestGroup) bestGroup.holes.push(h.pts);
  }

  return groups;
}

// ── SVG Path Parsing ──

function getPathData(el) {
  const tag = el.tagName.toLowerCase();
  if (tag === 'path') return el.getAttribute('d');
  if (tag === 'rect') {
    const x=+(el.getAttribute('x')||0), y=+(el.getAttribute('y')||0), w=+(el.getAttribute('width')||0), h=+(el.getAttribute('height')||0);
    return `M${x},${y}L${x+w},${y}L${x+w},${y+h}L${x},${y+h}Z`;
  }
  if (tag === 'circle') { const cx=+(el.getAttribute('cx')||0), cy=+(el.getAttribute('cy')||0), r=+(el.getAttribute('r')||0); return ellipsePath(cx,cy,r,r); }
  if (tag === 'ellipse') { const cx=+(el.getAttribute('cx')||0), cy=+(el.getAttribute('cy')||0), rx=+(el.getAttribute('rx')||0), ry=+(el.getAttribute('ry')||0); return ellipsePath(cx,cy,rx,ry); }
  if (tag === 'polygon' || tag === 'polyline') {
    const pts = el.getAttribute('points').trim().split(/[\s,]+/).map(Number);
    let d = ''; for (let i=0;i<pts.length;i+=2) d += (i===0?'M':'L')+pts[i]+','+pts[i+1]+' ';
    if (tag === 'polygon') d += 'Z'; return d;
  }
  return null;
}

function ellipsePath(cx,cy,rx,ry) {
  const s=64; let d='';
  for (let i=0;i<=s;i++) { const a=(i/s)*Math.PI*2; d+=(i===0?'M':'L')+(cx+rx*Math.cos(a))+','+(cy+ry*Math.sin(a))+' '; }
  return d+'Z';
}

function parsePathToSubpaths(d) {
  const tokens = d.match(/[a-zA-Z]|[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g);
  if (!tokens) return [];
  const subpaths = [];
  let current=[], cx=0,cy=0,sx=0,sy=0, i=0, prevCmd='', lcx=0,lcy=0;
  function num(){return parseFloat(tokens[i++]);}
  function hasN(){return i<tokens.length&&/^[-+\d.]/.test(tokens[i]);}
  function push(x,y){if(!current.length||current[current.length-1][0]!==x||current[current.length-1][1]!==y)current.push([x,y]);}
  function cubicP(x0,y0,x1,y1,x2,y2,x3,y3){const pts=[],st=16;for(let t=1;t<=st;t++){const u=t/st,v=1-u;pts.push([v*v*v*x0+3*v*v*u*x1+3*v*u*u*x2+u*u*u*x3,v*v*v*y0+3*v*v*u*y1+3*v*u*u*y2+u*u*u*y3]);}return pts;}
  function quadP(x0,y0,x1,y1,x2,y2){const pts=[],st=12;for(let t=1;t<=st;t++){const u=t/st,v=1-u;pts.push([v*v*x0+2*v*u*x1+u*u*x2,v*v*y0+2*v*u*y1+u*u*y2]);}return pts;}
  function arcP(rx,ry,rot,la,sw,ex,ey){const x1=cx,y1=cy;if(rx===0||ry===0)return[[ex,ey]];rx=Math.abs(rx);ry=Math.abs(ry);const phi=rot*Math.PI/180,cp=Math.cos(phi),sp=Math.sin(phi);const dx2=(x1-ex)/2,dy2=(y1-ey)/2;const x1p=cp*dx2+sp*dy2,y1p=-sp*dx2+cp*dy2;let rxS=rx*rx,ryS=ry*ry;const x1S=x1p*x1p,y1S=y1p*y1p;let lam=x1S/rxS+y1S/ryS;if(lam>1){const s=Math.sqrt(lam);rx*=s;ry*=s;rxS=rx*rx;ryS=ry*ry;}let sq=(rxS*ryS-rxS*y1S-ryS*x1S)/(rxS*y1S+ryS*x1S);if(sq<0)sq=0;const co=((la===sw)?-1:1)*Math.sqrt(sq);const cxp=co*rx*y1p/ry,cyp=-co*ry*x1p/rx;const ccx=cp*cxp-sp*cyp+(x1+ex)/2,ccy=sp*cxp+cp*cyp+(y1+ey)/2;function ang(ux,uy,vx,vy){const d=ux*vx+uy*vy,l=Math.sqrt(ux*ux+uy*uy)*Math.sqrt(vx*vx+vy*vy);let a=Math.acos(Math.max(-1,Math.min(1,d/l)));if(ux*vy-uy*vx<0)a=-a;return a;}let t1=ang(1,0,(x1p-cxp)/rx,(y1p-cyp)/ry);let dt=ang((x1p-cxp)/rx,(y1p-cyp)/ry,(-x1p-cxp)/rx,(-y1p-cyp)/ry);if(!sw&&dt>0)dt-=2*Math.PI;if(sw&&dt<0)dt+=2*Math.PI;const steps=Math.max(8,Math.ceil(Math.abs(dt)/(Math.PI/16)));const pts=[];for(let s=1;s<=steps;s++){const t=t1+dt*(s/steps);const xr=rx*Math.cos(t),yr=ry*Math.sin(t);pts.push([cp*xr-sp*yr+ccx,sp*xr+cp*yr+ccy]);}return pts;}
  function fin(){if(current.length>2)subpaths.push(current);current=[];}

  while(i<tokens.length){
    let cmd=tokens[i];
    if(/[a-zA-Z]/.test(cmd)){i++;}else{cmd=prevCmd;}
    switch(cmd){
      case'M':fin();cx=num();cy=num();sx=cx;sy=cy;current=[[cx,cy]];while(hasN()){cx=num();cy=num();push(cx,cy);}prevCmd='L';continue;
      case'm':fin();cx+=num();cy+=num();sx=cx;sy=cy;current=[[cx,cy]];while(hasN()){cx+=num();cy+=num();push(cx,cy);}prevCmd='l';continue;
      case'L':while(hasN()){cx=num();cy=num();push(cx,cy);}break;
      case'l':while(hasN()){cx+=num();cy+=num();push(cx,cy);}break;
      case'H':while(hasN()){cx=num();push(cx,cy);}break;
      case'h':while(hasN()){cx+=num();push(cx,cy);}break;
      case'V':while(hasN()){cy=num();push(cx,cy);}break;
      case'v':while(hasN()){cy+=num();push(cx,cy);}break;
      case'C':while(hasN()){const x1=num(),y1=num(),x2=num(),y2=num(),x=num(),y=num();for(const p of cubicP(cx,cy,x1,y1,x2,y2,x,y))push(p[0],p[1]);lcx=x2;lcy=y2;cx=x;cy=y;}break;
      case'c':while(hasN()){const x1=cx+num(),y1=cy+num(),x2=cx+num(),y2=cy+num(),x=cx+num(),y=cy+num();for(const p of cubicP(cx,cy,x1,y1,x2,y2,x,y))push(p[0],p[1]);lcx=x2;lcy=y2;cx=x;cy=y;}break;
      case'S':while(hasN()){let x1=2*cx-lcx,y1=2*cy-lcy;if(!'CcSs'.includes(prevCmd)){x1=cx;y1=cy;}const x2=num(),y2=num(),x=num(),y=num();for(const p of cubicP(cx,cy,x1,y1,x2,y2,x,y))push(p[0],p[1]);lcx=x2;lcy=y2;cx=x;cy=y;}break;
      case's':while(hasN()){let x1=2*cx-lcx,y1=2*cy-lcy;if(!'CcSs'.includes(prevCmd)){x1=cx;y1=cy;}const x2=cx+num(),y2=cy+num(),x=cx+num(),y=cy+num();for(const p of cubicP(cx,cy,x1,y1,x2,y2,x,y))push(p[0],p[1]);lcx=x2;lcy=y2;cx=x;cy=y;}break;
      case'Q':while(hasN()){const x1=num(),y1=num(),x=num(),y=num();for(const p of quadP(cx,cy,x1,y1,x,y))push(p[0],p[1]);lcx=x1;lcy=y1;cx=x;cy=y;}break;
      case'q':while(hasN()){const x1=cx+num(),y1=cy+num(),x=cx+num(),y=cy+num();for(const p of quadP(cx,cy,x1,y1,x,y))push(p[0],p[1]);lcx=x1;lcy=y1;cx=x;cy=y;}break;
      case'T':while(hasN()){let x1=2*cx-lcx,y1=2*cy-lcy;if(!'QqTt'.includes(prevCmd)){x1=cx;y1=cy;}const x=num(),y=num();for(const p of quadP(cx,cy,x1,y1,x,y))push(p[0],p[1]);lcx=x1;lcy=y1;cx=x;cy=y;}break;
      case't':while(hasN()){let x1=2*cx-lcx,y1=2*cy-lcy;if(!'QqTt'.includes(prevCmd)){x1=cx;y1=cy;}const x=cx+num(),y=cy+num();for(const p of quadP(cx,cy,x1,y1,x,y))push(p[0],p[1]);lcx=x1;lcy=y1;cx=x;cy=y;}break;
      case'A':while(hasN()){const arx=num(),ary=num(),rot=num(),la=num(),sw=num(),ex=num(),ey=num();for(const p of arcP(arx,ary,rot,la,sw,ex,ey))push(p[0],p[1]);cx=ex;cy=ey;}break;
      case'a':while(hasN()){const arx=num(),ary=num(),rot=num(),la=num(),sw=num(),ex=cx+num(),ey=cy+num();for(const p of arcP(arx,ary,rot,la,sw,ex,ey))push(p[0],p[1]);cx=ex;cy=ey;}break;
      case'Z':case'z':cx=sx;cy=sy;if(current.length>1){const f=current[0],l=current[current.length-1];if(Math.abs(f[0]-l[0])<0.01&&Math.abs(f[1]-l[1])<0.01)current.pop();}fin();break;
      default:i++;
    }
    prevCmd=cmd;
  }
  fin();
  return subpaths;
}

// ── Binary STL ──
function buildStlBinary(triangles) {
  const numTri=triangles.length, bufLen=84+numTri*50;
  const buf=new ArrayBuffer(bufLen), view=new DataView(buf);
  const hdr='SVG-to-STL'; for(let i=0;i<80;i++)view.setUint8(i,i<hdr.length?hdr.charCodeAt(i):0);
  view.setUint32(80,numTri,true);
  const positions=new Float32Array(numTri*9), normals=new Float32Array(numTri*9);
  let off=84;
  for(let t=0;t<numTri;t++){
    const tr=triangles[t];
    view.setFloat32(off,tr.n[0],true);off+=4;view.setFloat32(off,tr.n[1],true);off+=4;view.setFloat32(off,tr.n[2],true);off+=4;
    for(let v=0;v<3;v++){
      view.setFloat32(off,tr.v[v][0],true);off+=4;view.setFloat32(off,tr.v[v][1],true);off+=4;view.setFloat32(off,tr.v[v][2],true);off+=4;
      const idx=t*9+v*3;positions[idx]=tr.v[v][0];positions[idx+1]=tr.v[v][1];positions[idx+2]=tr.v[v][2];
      normals[idx]=tr.n[0];normals[idx+1]=tr.n[1];normals[idx+2]=tr.n[2];
    }
    view.setUint16(off,0,true);off+=2;
  }
  return{blob:new Blob([buf],{type:'application/octet-stream'}),triangleCount:numTri,positions,normals};
}

// ── Three.js preview ──
let renderer,scene,camera,mesh,animId;
function renderStlPreview(positions,normals){
  if(animId)cancelAnimationFrame(animId);if(renderer)renderer.dispose();
  const w=glCanvas.clientWidth,h=glCanvas.clientHeight;
  glCanvas.width=w*devicePixelRatio;glCanvas.height=h*devicePixelRatio;
  renderer=new THREE.WebGLRenderer({canvas:glCanvas,antialias:true,alpha:true});
  renderer.setSize(w,h);renderer.setPixelRatio(devicePixelRatio);renderer.setClearColor(0x2e2e36,1);
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(40,w/h,0.1,2000);
  const geom=new THREE.BufferGeometry();
  geom.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geom.setAttribute('normal',new THREE.BufferAttribute(normals,3));
  const mat=new THREE.MeshPhongMaterial({color:0x4a9eff,specular:0x222244,shininess:40,side:THREE.DoubleSide,flatShading:true});
  if(mesh)scene.remove(mesh);mesh=new THREE.Mesh(geom,mat);scene.add(mesh);
  geom.computeBoundingBox();const box=geom.boundingBox;
  const center=new THREE.Vector3();box.getCenter(center);
  const size=new THREE.Vector3();box.getSize(size);
  const maxDim=Math.max(size.x,size.y,size.z);
  mesh.position.sub(center);
  // STL convention: Z is up, front face at -Y. Set Three.js camera accordingly.
  camera.up.set(0,0,1);
  camera.position.set(0,-maxDim*2.2,0);camera.lookAt(0,0,0);
  scene.add(new THREE.AmbientLight(0x404060));
  const dir=new THREE.DirectionalLight(0xffffff,0.9);dir.position.set(1,-2,2);scene.add(dir);
  const dir2=new THREE.DirectionalLight(0x8888ff,0.4);dir2.position.set(-1,1,-1);scene.add(dir2);
  let angle=0;
  function animate(){animId=requestAnimationFrame(animate);angle+=0.005;mesh.rotation.z=Math.sin(angle)*0.6;mesh.rotation.x=0.15;renderer.render(scene,camera);}
  animate();
}
